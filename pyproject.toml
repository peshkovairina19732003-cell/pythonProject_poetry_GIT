[build-system]
requires = ["poetry-core>=1.8.3"]
build-backend = "poetry.core.masonry.api"

# Основной блок с информацией о проекте
[project]
name = "pythonproject-poetry-GIT" # Можно убрать, если вы не планируете публиковать пакет
version = "0.1.0"
description = ""
authors = [
    { name = "Irina Peshkova", email = "peshkova.irina19732003@gmail.com"}
]
license = "MIT"
readme = "README.md"

# Отключаем упаковку проекта, так как мы просто пишем приложение
package-mode = false

# Требуемая версия Python
requires-python = ">=3.10"

# Зависимости для работы приложения
dependencies = [
    "python-dotenv >=1.2.2,<2.0.0",
    "requests >=2.34.2,<3.0.0",
]

# Зависимости только для разработки (тестирование, линтеры)
[project.optional-dependencies]
dev = [
     "pytest-mock >=3.15",     # Проверенная рабочая версия
    "mypy >=1.6",             # Актуальная ветка
    "flake8 >=7.0",            # Исправлена опечатка! Версии 7.* не существует
    "black >=23.9",            # Последняя стабильная версия на июль/август 2024
    "isort >=5.12",           # Актуальная ветка
    "pytest-cov >=4.1"         # Актуальная ветка
]

# Настройки инструментов
[tool.isort]
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["django", "flask"]
line_length = 123

[tool.black]
line-length = 123
skip-string-normalization = true

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
